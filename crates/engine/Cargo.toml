[package]
name = "git-scylla-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TypeScript generation for the M2 shell. Off by default: it is a build-time
# concern for one consumer, and every other crate in the workspace pays nothing.
ts = ["dep:ts-rs", "git-scylla-core/ts", "git-scylla-discovery/ts"]

[dependencies]
git-scylla-core = { workspace = true }
git-scylla-discovery = { workspace = true }
git-scylla-exec = { workspace = true }
git-scylla-probe = { workspace = true }
git-scylla-store = { workspace = true }
git-scylla-watch = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
git-scylla-core = { workspace = true, features = ["testkit"] }
git-scylla-probe = { workspace = true }
git-scylla-store = { workspace = true }
git-scylla-watch = { workspace = true }
git-scylla-discovery = { workspace = true }
git-scylla-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
