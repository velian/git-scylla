[package]
name = "git-scylla-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `FakeProbe`, for planning tests in other crates. Off by default so a shipped
# binary cannot construct invented ref answers, exactly as `core`'s `testkit`
# feature guards `RepoSnapshot::stub` — which this needs, and so enables.
testkit = ["git-scylla-core/testkit"]

[dependencies]
git-scylla-core = { workspace = true }
git-scylla-discovery = { workspace = true }
git-scylla-exec = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
git-scylla-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
